name: Feature request
description: Propose a focused improvement to QuantX.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Feature requests are evaluated against QuantX's market-neutral core, India-first implementation scope, safety invariants, and documented roadmap. Please describe the problem before proposing a solution.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What limitation are you encountering, and who experiences it?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the behavior or capability that would solve the problem.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Explain any workaround or alternative design you have considered.
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Project area
      options:
        - Universal core
        - Market modules
        - India market
        - Broker or data plugin
        - Research and data
        - Strategy and backtesting
        - Paper execution
        - Documentation and onboarding
        - Developer tooling
        - Other
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints and safety implications
      description: Note data provenance, determinism, failure behavior, and whether the proposal affects execution boundaries.
      placeholder: Include any relevant scope or compatibility constraints.
    validations:
      required: false
  - type: checkboxes
    id: confirmation
    attributes:
      label: Scope
      options:
        - label: I have checked the current roadmap and searched existing issues for duplicates.
          required: true
        - label: This request does not require real broker orders, production API calls, or LIVE execution.
          required: true
