[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "quantx"
version = "0.1.0.dev0"
description = "Market-neutral trading infrastructure with an India-first market implementation."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "QuantX Contributors" }]
keywords = [
  "algorithmic-trading",
  "backtesting",
  "india-markets",
  "market-neutral",
  "paper-trading",
  "trading-infrastructure",
]
classifiers = [
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = ["tzdata>=2024.1"]

[project.urls]
Homepage = "https://github.com/jignesh2795/QuantX"
Repository = "https://github.com/jignesh2795/QuantX"
Issues = "https://github.com/jignesh2795/QuantX/issues"
Documentation = "https://github.com/jignesh2795/QuantX/tree/main/docs"

[project.optional-dependencies]
dhan = [
  "dhanhq==2.2.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/quantx"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["quantx"]

# The optional Dhan SDK (dhanhq==2.2.0) ships no py.typed marker or stubs, so
# mypy reports import-not-found when the extra is absent and import-untyped
# when it is installed. This module-scoped override keeps the vendor import
# boundary quiet in both dependency configurations; SDK imports remain
# confined to src/quantx/plugins/dhan/transport.py (enforced by test).
[[tool.mypy.overrides]]
module = ["dhanhq", "dhanhq.*"]
ignore_missing_imports = true

[tool.uv]
default-groups = ["dev"]
